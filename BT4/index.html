<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="./layout.css">
<body>
<div class="top">
        <div class="img1">

            <img src="./top1.png" alt="Logo">
        </div>

        <div class="content">
            <span>About us</span>
            <span>Our Class </span>
            <span>Blog</span>
            <span>Contact</span>
        </div>

        <div class="p">
            <img src="./ShoppingBag.png" alt="Cart" class="cart-icon">
            <div class="search-box">
                🔍 Search
            </div>
        </div>
    </div>

    <div class="under">
        <div class="left">
            <div class="info1">

                <h2><b>Master Digital Skills<br>with Ease!</b></h2>
            </div>

            <div class="info2">
                <p>Unlock Digital Mastery Effortlessly! Explore and enhance your skills with our user-friendly platform.</p>
            </div>

            <div class="info3">
                <b>Total students</b>
                <img src="./Frame 48095513.png" alt="Students">
            </div>

            <div class="info4">
                <button class="btn-start">Start learning</button>
                <button class="btn-learn">Learn more</button>
            </div>

            <div class="info5">
                <p><u>Trust by</u></p>
                <div class="logos">
                    <img src="./Google Logotype.png" alt="Google">
                    <img src="./canva.jpg" alt="Canva">
                    <img src="./amazon.jpg" alt="Amazon">
                    <img src="./sketch.png" alt="Sketch">
                </div>
            </div>
        </div>

        <div class="right">

            <div class="info7">
                <h4>Certified Instructor</h4>
                
                <div class="instructor">
                    <img src="./nguoi1.jpg" alt="Donald">
                    <div class="instructor-text">
                        <b>Donald Robert</b>
                        <span>UI/UX Design</span>
                    </div>
                </div>

                <div class="instructor">
                    <img src="./nguoi2.jpg" alt="John">
                    <div class="instructor-text">
                        <b>John White</b>
                        <span>Web Development</span>
                    </div>
                </div>
            </div>

            <div class="info6">
                <img src="./Rectangle 1455.png" alt="Main Model" class="main-img">
            </div>
        </div>
    </div>
</body>
</html>
